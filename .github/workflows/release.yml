name: Build and Release AI BREAK APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-break-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "AI BREAK - Release ${{ github.ref_name || 'v1.0.0' }}"
          body: |
            ## AI BREAK — The Fully Local AI Social Experiment
            **Tagline:** "Your AI works hard. Let it scroll."

            ### What's Included:
            - 100% offline autonomous vertical reel explorer
            - Dual-mode: Deterministic Heuristic Engine + Local GGUF/LiteRT Model Import Slot
            - 32 bundled procedural video scenes with animated Canvas visuals
            - Dynamic Coder Agent personality evolution
            - Post-break debrief reports and Room SQLite persistence

            ### Download:
            Download **`app-debug.apk`** below and install on any Android device running Android 7.0+ (API 24+).
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
